name: PR checks

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    uses: EightMedia/ci-workflows/.github/workflows/pr-checks.yml@v1
    with:
      health-check: false
      build-command: pnpm test && pnpm build
